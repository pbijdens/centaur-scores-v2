name: "CentaurScores Build"

permissions:
  contents: write

on:
  # pull_request:
  #   branches:
  #     - main
  push:
    branches:
      - main
    paths:
      - 'centaur-scores/**'
      - '.github/workflows/centaur-scores-build.yaml'

defaults:
  run:
    working-directory: centaur-scores

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
        #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

        #2 Setup Java
      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

        #3 Setup Flutter
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

        #4 Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

        #5 Set Build Version
      - name: Set Build Version in pubspec.yaml
        id: set_version
        run: |
          version="2.0.0+${{ github.run_number }}"
          sed -i "s/^version: .*/version: $version/" pubspec.yaml
          echo "VERSION=$version" >> $GITHUB_ENV

#        #6 Setup Keystore
#      - name: Decode Keystore
#        run: |
#          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

#      - name: Create key.properties
#        run: |
#          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
#          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
#          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
#          echo "storeFile=keystore.jks" >> android/key.properties
#
       #7 Building APK in debug mode because Android 23 won't run the release version
      - name: Build APK in Debug mode
        run: flutter build apk --debug

      - name: Build APK in Release mode
        run: flutter build apk --release

#        #8 Building App Bundle (aab)
#      - name: Build appBundle
#        run: flutter build appbundle

#        #9 Build IPA ( IOS Build )
#      - name: Build IPA
#        run: flutter build ipa --no-codesign

#      - name: Compress Archives and IPAs
#        run: |
#          cd build
#          tar -czf ios_build.tar.gz ios

        #10 Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: |
            centaur-scores/build/app/outputs/flutter-apk/app-debug.apk
            centaur-scores/build/app/outputs/flutter-apk/app-release.apk
#            centaur-scores/build/app/outputs/bundle/release/app-release.aab
#            centaur-scores/build/ios_build.tar.gz

        #11 Check if Tag Exists
      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

        #12 Modify Tag if it Exists
      - name: Modify Tag
        if: env.TAG_EXISTS == 'true'
        id: modify_tag
        run: |
          new_version="${{ env.VERSION }}-build-${{ github.run_number }}"
          echo "VERSION=$new_version" >> $GITHUB_ENV

        #13 Create Release
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
#          artifacts: "centaur-scores/build/app/outputs/flutter-apk/app-release.apk,centaur-scores/build/app/outputs/bundle/release/app-release.aab,centaur-scores/build/ios_build.tar.gz"
          artifacts: "centaur-scores/build/app/outputs/flutter-apk/app-debug.apk,centaur-scores/build/app/outputs/flutter-apk/app-release.apk"
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
